<text x="102" y="158" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">雾图输入</text>
<text x="102" y="194" text-anchor="middle" font-size="15" font-weight="400" fill="#64748b">RGB · [0, 1]</text>
<text x="361" y="146" text-anchor="middle" font-size="24" font-weight="600" fill="#065f46">ColorAwareUNet</text>
