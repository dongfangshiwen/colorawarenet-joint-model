<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="342" viewBox="0 0 1280 342" role="img" aria-labelledby="title desc">
<title id="title">方法概览</title><desc id="desc">全局 RGB 增益、空间残差与细化，用于去雾和后续语义分割。</desc>
